server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: Dhanushappbe
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dhanushdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    # Must be at least 32 characters. Always override in production.
    secret: ${JWT_SECRET:change-me-dhanush-app-local-jwt-secret-0123456789}
    expiry-seconds: 7200
    cookie-name: access_token
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
  vault:
    # Base64 of exactly 32 bytes (AES-256). Always override in production.
    encryption-key: ${VAULT_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  mail:
    from: ${MAIL_FROM:no-reply@dhanushapp.local}
    # Only for local development: writes the reset link to the log when no mail server is set.
    log-reset-links: ${LOG_RESET_LINKS:false}
  uploads:
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:dbiznnnha}
      api-key: ${CLOUDINARY_API_KEY:346689162527427}
      api-secret: ${CLOUDINARY_API_SECRET:IwzVvc9mI-hGU907MkKUBsmccmE}
    # Used when Cloudinary is not configured (local development only)
    local-dir: ${LOCAL_UPLOAD_DIR:./uploads}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080/api}

